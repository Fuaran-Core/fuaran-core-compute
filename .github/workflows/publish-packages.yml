name: publish-packages

# Released distribution channel for this repository's four packages (Fuaran.Compute.DataFrame,
# Fuaran.Compute.ColumnOps, Fuaran.Compute.PipelineQuery, Fuaran.Compute.Conformance):
# nuget.org — the public, no-auth-restore channel. Bump <Version> in Directory.Build.props, commit,
# then tag vX.Y.Z and push the tag to trigger this workflow. A branch push reaches no job here.
# Re-runs of the same tag are idempotent (--skip-duplicate).
#
# BEFORE THE FIRST TAG: the nuget.org Trusted Publishing policy for THIS repository
# (Fuaran-Core/fuaran-core-compute, workflow publish-packages.yml) must be registered by the package
# owner. Until it is, the run fails at the NuGet/login step — which reads like an authentication
# problem and is the missing registration.
#
# THE IDS CHANGED AT 0.36.0 (Phase 322, DECISIONS.md D4). Through 0.34.0 these packages published as
# Fuaran.Core.DataFrame, Fuaran.Core.Column.Ops and Fuaran.Core.DataFrame.Conformance; nothing here
# packs those ids any more, and they are not republished. A nuget.org Trusted Publishing policy is
# scoped to package ids, so the policy must be extended to the four Fuaran.Compute.* ids before the
# first v* tag under them: a failed NuGet/login (or a push refused for those ids) on that tag is the
# missing registration, not an authentication fault.
#
# Phase 404 - a publish is the repository's own gate in Release, and the pack is `--no-build` over
# THAT output: `verify.ps1 -Configuration Release` builds and runs the whole suite (and the clock leg)
# with the inputs the ci workflow gives it, and the assemblies it verified are the assemblies that
# ship, not a second build of the same sources.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # `id-token: write` lets the job request the GitHub OIDC token that
  # nuget.org's Trusted Publishing exchange turns into a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The gate below reads the repository's release TAGS (the package-roster and surface checks),
      # exactly as ci.yml's does: the history and the tags, not a depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # nuget.config names a local folder feed two levels above the repository (the development
      # loop's); NuGet refuses a missing folder source (NU1301), so an empty one is minted here and
      # every Fuaran.Core package restores from nuget.org.
      - name: Create the empty local feed directory
        run: mkdir -p ../../local-nuget-feed
      # The gate's inputs, as ci.yml gives them: the conformance corpus the law-vector legs compare
      # against, checked out inside the workspace.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
      - name: Verify the Release build (./verify.ps1 -Configuration Release)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./verify.ps1 -Configuration Release
      - name: Pack what was verified (every packable src project, --no-build)
        run: dotnet pack Fuaran.Core.Compute.slnx -c Release --no-build -o ${{ runner.temp }}/nupkgs
      # Auth is Trusted Publishing (OIDC): a policy on nuget.org (repo owner / repo / this
      # workflow's file name) exchanges the job's OIDC token for a 1-hour API key — no long-lived
      # key secret to rotate.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ajwillshire # the policy creator (a nuget.org profile name is public, not a secret)
      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
